<ion-header>
  <ion-toolbar color="success">
    <ion-title>Brunch Express</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="presentacion">
    <h1>Bienvenidos a Brunch Express</h1>

    <p>Disfruta de nuestros desayunos, bebidas y platos especiales.</p>
  </div>

  <ion-card>
    <ion-card-header>
      <ion-card-title> Nuestro menú </ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <p>Explora nuestros platos y encuentra tu desayuno favorito.</p>

      <ion-button expand="block" color="success" routerLink="/tabs/tab2"> Ver menú </ion-button>
    </ion-card-content>
  </ion-card>

  <ion-card>
    <ion-card-header>
      <ion-card-title> Realiza tu pedido </ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <p>Agrega tus productos al carrito y confirma tu pedido fácilmente.</p>
    </ion-card-content>
  </ion-card>
</ion-content>
